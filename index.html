<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Infrastructure Engineer — 17-Day Intensive Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    /* Paper & ink */
    --bg:        #F5F6F3;
    --bg2:       #FFFFFF;
    --bg3:       #F1F2EF;
    --border:    #E3E5E0;
    --border2:   #CDD0C9;
    --text:      #14161A;
    --muted:     #5C6270;
    --dim:       #949AA3;

    /* Stage hues — tuned to one shared lightness so they read as a set */
    --blue:      #2B59C3;
    --blue-bg:   #DCE4F7;
    --blue-dim:  #EDF1FB;

    --green:     #1B7A4B;
    --green-bg:  #D6EFE0;
    --green-dim: #EAF7F0;

    --amber:     #96600F;
    --amber-bg:  #F7E7C6;
    --amber-dim: #FBF3E2;

    --red:       #B03A3A;
    --red-bg:    #F7DCDC;
    --red-dim:   #FBEDED;

    --purple:    #5B3FBF;
    --purple-bg: #E4DDF8;
    --purple-dim:#F1EDFB;

    --teal:      #0E7C74;
    --teal-bg:   #D0EFEC;
    --teal-dim:  #E7F7F5;

    /* Terminal surface for code */
    --term:      #1A1E24;
    --term-text: #D6DBE3;

    --radius-sm: 6px;
    --radius:    10px;
    --radius-lg: 14px;

    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    --display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    --shadow-sm: 0 1px 2px rgba(20,22,26,.05);
    --shadow:    0 1px 3px rgba(20,22,26,.06), 0 6px 16px -6px rgba(20,22,26,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 3px; }

  /* Layout */
  .app { display: grid; grid-template-columns: 288px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  .main { overflow-y: auto; }

  /* ── Sidebar header ─────────────────────────────────── */
  .sidebar-header { padding: 22px 18px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-logo { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }

  /* Page switch — roadmap ⇄ sessions */
  .page-switch { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg3); padding: 3px; margin-bottom: 16px; }
  .ps-link { flex: 1; text-align: center; text-decoration: none; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 8px; border-radius: 4px; transition: background .15s, color .15s, box-shadow .15s; }
  .ps-link:hover { color: var(--text); }
  .ps-link.active { background: var(--bg2); color: var(--text); box-shadow: var(--shadow-sm); }
  .logo-icon { width: 36px; height: 36px; background: var(--text); color: #fff; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .sidebar-title { font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: -.01em; color: var(--text); line-height: 1.25; }
  .sidebar-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: -.01em; margin-top: 2px; }

  .sidebar-progress { }
  .sp-label { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px; }
  .sp-label > span:first-child { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  #sp-pct { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.03em; line-height: 1; }
  .sp-bar-wrap { background: var(--bg3); border-radius: 99px; height: 5px; overflow: hidden; }
  .sp-bar { background: var(--text); height: 5px; border-radius: 99px; transition: width .35s cubic-bezier(.4,0,.2,1); }
  .sp-stats { display: flex; gap: 0; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .sp-stat { flex: 1; background: transparent; border: 0; border-right: 1px solid var(--border); padding: 8px 6px; text-align: center; }
  .sp-stat:last-child { border-right: 0; }
  .sp-stat-num { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .sp-stat-lbl { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }

  /* ── Auth state ──────────────────────────────────────── */
  .sidebar-foot { padding: 13px 14px 16px; border-top: 1px solid var(--border); }
  .auth-box { display: flex; align-items: center; gap: 9px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; }
  .auth-box.is-admin { background: var(--green-dim); border-color: var(--green-bg); }
  .auth-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .auth-box.is-admin .auth-dot { background: var(--green); box-shadow: 0 0 0 3px rgba(27,122,75,.15); }
  .auth-text { flex: 1; min-width: 0; }
  .auth-role { font-size: 11.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .auth-note { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .auth-btn { font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--muted); background: var(--bg2); border: 1px solid var(--border2); border-radius: 5px; padding: 5px 9px; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .auth-btn:hover { color: var(--text); border-color: var(--dim); }

  /* ── Sidebar: the pipeline rail ──────────────────────── */
  .sidebar-nav { flex: 1; padding: 14px 12px 24px; overflow-y: auto; }
  .stage-group { }

  .stage-nav-header { position: relative; padding: 14px 8px 6px 30px; cursor: default; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stage-nav-header::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  #sidebar-nav .stage-group:first-child .stage-nav-header::before { top: 18px; }
  .rail-day { font-family: var(--display); font-size: 12.5px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .rail-date { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: -.01em; }

  .stage-nav-items { }
  .nav-item { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 30px; border-radius: var(--radius-sm); cursor: pointer; color: var(--muted); font-size: 12.5px; transition: background .15s, color .15s; border: 1px solid transparent; }
  .nav-item::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  #sidebar-nav .stage-group:last-child .nav-item:last-child::before { bottom: 50%; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--bg3); color: var(--text); font-weight: 500; }
  .nav-item.done-nav { color: var(--dim); }
  .nav-item.done-nav::before { background: var(--green); opacity: .4; }

  .nav-dot { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--bg2); border: 2px solid var(--dim); flex-shrink: 0; z-index: 1; transition: box-shadow .15s, background .15s, border-color .15s; }
  .nav-item.stage-1 .nav-dot { border-color: var(--blue); }
  .nav-item.stage-2 .nav-dot { border-color: var(--green); }
  .nav-item.stage-3 .nav-dot { border-color: var(--amber); }
  .nav-item.stage-4 .nav-dot { border-color: var(--red); }
  .nav-item.stage-5 .nav-dot { border-color: var(--purple); }
  .nav-item.stage-6 .nav-dot { border-color: var(--teal); }
  .nav-item.done-nav .nav-dot { background: var(--green); border-color: var(--green); }
  .nav-item.active .nav-dot { box-shadow: 0 0 0 4px var(--bg3); }

  /* Discussion sessions read as a different kind of stop on the rail */
  .nav-item.nav-item-discussion { color: var(--teal); }
  .nav-item.nav-item-discussion .nav-dot { border-radius: 2px; transform: translateY(-50%) rotate(45deg); background: var(--teal-bg); border-color: var(--teal); }
  .nav-item.nav-item-discussion.done-nav .nav-dot { background: var(--green); border-color: var(--green); }
  .nav-item.nav-item-discussion.active { background: var(--teal-dim); }
  .nav-item.nav-item-discussion.done-nav { color: var(--dim); }
  .nav-week-label { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-left: auto; }
  .nav-label { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
  .nav-label-discussion { font-style: italic; }

  /* ── Main header ─────────────────────────────────────── */
  .main-header { padding: 26px 36px 20px; border-bottom: 1px solid var(--border); background: rgba(245,246,243,.86); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }
  .breadcrumb { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .breadcrumb span { color: var(--dim); }
  .breadcrumb span:first-child { color: var(--muted); font-weight: 600; }
  .day-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .day-title { font-family: var(--display); font-size: 27px; font-weight: 700; color: var(--text); line-height: 1.15; letter-spacing: -.025em; }
  .day-meta { display: flex; align-items: center; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); padding: 3px 9px; border-radius: 5px; font-size: 10.5px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .complete-btn { font-family: var(--body); padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg2); color: var(--muted); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .18s; display: flex; align-items: center; gap: 7px; white-space: nowrap; box-shadow: var(--shadow-sm); }
  .complete-btn:hover { border-color: var(--green); color: var(--green); }
  .complete-btn.done-btn { background: var(--green-bg); border-color: var(--green); color: var(--green); }

  .main-body { padding: 30px 36px 60px; max-width: 940px; }

  /* ── Goal banner ─────────────────────────────────────── */
  .goal-banner { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--text); border-radius: var(--radius); padding: 17px 20px; margin-bottom: 26px; display: flex; gap: 15px; align-items: flex-start; box-shadow: var(--shadow-sm); }
  .goal-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .goal-label { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
  .goal-text { font-size: 14px; color: var(--text); line-height: 1.55; }
  .goal-output { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .goal-output strong { color: var(--text); font-weight: 600; }

  /* ── Section cards ───────────────────────────────────── */
  .section-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .section-card-header { padding: 13px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid transparent; transition: background .15s; }
  .section-card-header:hover { background: var(--bg3); }
  .section-card-header.open { border-bottom-color: var(--border); }
  .section-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .section-title { font-family: var(--display); font-size: 13.5px; font-weight: 600; color: var(--text); flex: 1; letter-spacing: -.01em; }
  .section-count { font-family: var(--mono); font-size: 10px; color: var(--muted); background: var(--bg3); border: 1px solid var(--border); padding: 2px 8px; border-radius: 20px; }
  .chevron { font-size: 10px; color: var(--dim); transition: transform .2s; }
  .chevron.open { transform: rotate(180deg); }
  .section-body { display: none; padding: 0 18px 16px; }
  .section-body.open { display: block; }

  /* ── Learn items ─────────────────────────────────────── */
  .learn-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .learn-item { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 15px; }
  .learn-item-top { display: flex; align-items: flex-start; gap: 11px; }
  .learn-bullet { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
  .learn-item-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; letter-spacing: -.005em; }
  .learn-item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.65; }

  /* Code is terminal content — so it keeps the terminal's surface */
  .learn-item-code, .impl-item-code { font-family: var(--mono); font-size: 11px; background: var(--term); color: var(--term-text); border: 0; border-radius: var(--radius-sm); padding: 11px 13px; margin-top: 10px; overflow-x: auto; white-space: pre; line-height: 1.6; }
  .learn-item-code { color: #8DD3F0; }
  .impl-item-code { color: #8FE0AC; }

  /* ── Implement items ─────────────────────────────────── */
  .impl-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .impl-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 15px; cursor: pointer; transition: border-color .15s, background .15s; }
  .impl-item:hover { border-color: var(--border2); background: var(--bg3); }
  .impl-item.impl-done { background: var(--green-dim); border-color: var(--green-bg); }
  .impl-item-row { display: flex; align-items: flex-start; gap: 11px; }
  .impl-checkbox { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border2); background: var(--bg2); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .impl-item:hover .impl-checkbox { border-color: var(--green); }
  .impl-item.impl-done .impl-checkbox { background: var(--green); border-color: var(--green); }
  .impl-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; letter-spacing: -.005em; }
  .impl-item.impl-done .impl-title { color: var(--green); }
  .impl-desc { font-size: 12.5px; color: var(--muted); line-height: 1.65; }

  /* ── Resources ───────────────────────────────────────── */
  .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
  .resource-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; display: flex; align-items: flex-start; gap: 11px; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .resource-card:hover { border-color: var(--border2); box-shadow: var(--shadow); transform: translateY(-1px); }
  .resource-type-icon { width: 27px; height: 27px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .resource-name { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .resource-desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .resource-tag { font-family: var(--mono); font-size: 9.5px; padding: 1px 7px; border-radius: 20px; display: inline-block; margin-top: 6px; font-weight: 500; letter-spacing: .02em; }

  /* ── Milestone ───────────────────────────────────────── */
  .milestone-card { border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; border: 1px solid; }
  .ms-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ms-flag { font-size: 16px; }
  .ms-label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
  .ms-title { font-family: var(--display); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .ms-sub { font-size: 12.5px; line-height: 1.6; opacity: .85; }

  /* ── Prev / next ─────────────────────────────────────── */
  .nav-controls { display: flex; gap: 10px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--border); }
  .nav-btn { font-family: var(--body); padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg2); color: var(--muted); font-size: 12.5px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
  .nav-btn:hover { border-color: var(--border2); color: var(--text); }
  .nav-btn.primary { background: var(--text); border-color: var(--text); color: #fff; font-weight: 500; }
  .nav-btn.primary:hover { background: #000; border-color: #000; color: #fff; }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .nav-btn:disabled:hover { border-color: var(--border); color: var(--muted); }

  /* ── Scrollbar ───────────────────────────────────────── */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; border: 2px solid var(--bg2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; }
    .main-body { padding: 22px 18px 48px; }
    .main-header { padding: 20px 18px 16px; }
    .day-title { font-size: 22px; }
    .resource-grid { grid-template-columns: 1fr; }
    .day-title-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">🧠</div>
        <div>
          <div class="sidebar-title">AI Infra Engineer</div>
          <div class="sidebar-sub" id="sidebar-sub">17-Day Intensive Plan</div>
        </div>
      </div>
      <div class="page-switch">
        <a class="ps-link" href="sessions.html">Sessions</a>
        <a class="ps-link active" href="index.html" aria-current="page">AI-Infra Roadmap</a>
      </div>
      <div class="sidebar-progress">
        <div class="sp-label"><span>Overall progress</span><span id="sp-pct">0%</span></div>
        <div class="sp-bar-wrap"><div class="sp-bar" id="sp-bar" style="width:0%"></div></div>
        <div class="sp-stats">
          <div class="sp-stat"><div class="sp-stat-num" id="sp-days">0</div><div class="sp-stat-lbl">Topics done</div></div>
          <div class="sp-stat"><div class="sp-stat-num" id="sp-tasks">0</div><div class="sp-stat-lbl">Tasks done</div></div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-foot"><div id="auth-slot"></div></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header" id="main-header"></div>
    <div class="main-body" id="main-body"></div>
  </main>
</div>

<script src="auth.js"></script>
<script>
// ─── DATA ──────────────────────────────────────────────────────────────────
const stages = [
  { id:1, label:"Stage 1", name:"Infrastructure Foundation", color:"--blue", bg:"--blue-bg", dim:"--blue-dim" },
  { id:2, label:"Stage 2", name:"Model Serving & Inference", color:"--green", bg:"--green-bg", dim:"--green-dim" },
  { id:3, label:"Stage 3", name:"RAG Pipeline", color:"--amber", bg:"--amber-bg", dim:"--amber-dim" },
  { id:4, label:"Stage 4", name:"Security & LLMOps", color:"--red", bg:"--red-bg", dim:"--red-dim" },
  { id:5, label:"Stage 5", name:"Production & PoC Delivery", color:"--purple", bg:"--purple-bg", dim:"--purple-dim" },
  { id:6, label:"Review", name:"Discussion Sessions", color:"--teal", bg:"--teal-bg", dim:"--teal-dim" },
];

const days = [
  // ── WEEK 1 ──────────────────────────────────────────
  {
    id:"d01", week:1, stage:1, day:1, discussionIndex:null,
    title:"Linux Server Setup & Hardening",
    goal:"Provision a secure Ubuntu 22.04 server you can confidently run production services on",
    output:"Server accessible via SSH key-only auth, firewall active, non-root admin user configured",
    docLink:"SSH into this server — it will host every component of your Document Analyzer",
    learn:[
      { title:"Linux file system hierarchy", desc:"Understand /etc, /var, /home, /opt — where configs, logs, data, and installed software live", code:null },

// ─── SCHEDULE DATES ───────────────────────────────────────────────────────────
// Plan starts Monday, Aug 10 2026. Weekends (Sat/Sun) and Aug 26 2026 (holiday) are skipped.
const PLAN_START = new Date(2026, 7, 10); // month is 0-indexed: 7 = August
const HOLIDAYS = ['2026-08-26'];
// Local date parts — toISOString() converts to UTC first, which shifts the
// date backwards on UTC+ machines and skips the wrong day as a holiday.
function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isWeekend(d) { const day = d.getDay(); return day === 0 || day === 6; }

function buildPlanDates(numDays) {
  const result = [];
  let cursor = new Date(PLAN_START);
  while (result.length < numDays) {
    const iso = toISO(cursor);
    if (!isWeekend(cursor) && !HOLIDAYS.includes(iso)) {
      result.push(new Date(cursor));
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return result;
}
const TOTAL_PLAN_DAYS = Math.max(...days.map(d => d.week));
const planDates = buildPlanDates(TOTAL_PLAN_DAYS); // index 0 = Day 1's date
function formatPlanDate(dayNum) {
  const d = planDates[dayNum - 1];
  if (!d) return '';
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
}
const TOTAL_TOPICS = days.filter(d => d.stage !== 6).length;
{
  const subEl = document.getElementById('sidebar-sub');
  if (subEl && planDates.length) {
    const a = planDates[0], b = planDates[TOTAL_PLAN_DAYS - 1];
    const short = (d, withYear) => d.toLocaleDateString('en-GB', withYear
      ? { day: 'numeric', month: 'short', year: 'numeric' }
      : { day: 'numeric', month: 'short' });
    subEl.textContent = `${short(a, false)} → ${short(b, true)} · ${TOTAL_PLAN_DAYS} days`;
  }
}

// ─── STATE ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'ai-roadmap-v2';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || { doneDays: [], doneImpl: [] };
let currentDayId = days[0].id;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  const weekGroups = {};
  days.forEach(d => { if (!weekGroups[d.week]) weekGroups[d.week] = []; weekGroups[d.week].push(d); });
  Object.entries(weekGroups).forEach(([week, wdays]) => {
    const stage = stages.find(s => s.id === wdays[0].stage);
    const grp = document.createElement('div');
    grp.className = 'stage-group';
    const hdr = document.createElement('div');
    hdr.className = 'stage-nav-header';
    hdr.innerHTML = `<span class="rail-day">Day ${week}</span><span class="rail-date">${formatPlanDate(week)}</span>`;
    grp.appendChild(hdr);
    const items = document.createElement('div');
    items.className = 'stage-nav-items';
    wdays.forEach(d => {
      const isDone = state.doneDays.includes(d.id);
      const isActive = d.id === currentDayId;
      const isDiscussion = d.stage === 6;
      const item = document.createElement('div');
      item.className = `nav-item stage-${d.stage}${isActive ? ' active' : ''}${isDone ? ' done-nav' : ''}${isDiscussion ? ' nav-item-discussion' : ''}`;
      item.id = 'nav-' + d.id;
      // Titles already carry the "Open Discussion — " prefix; strip it so the
      // rail label doesn't repeat it, whatever the session is called.
      const label = isDiscussion
        ? `🗣️ Open Discussion — ${d.title.replace(/^Open Discussion — /, '').replace(/^Review: /, 'Review ')}`
        : `Topic ${d.day}: ${d.title}`;
      item.innerHTML = `<span class="nav-dot"></span><span class="nav-label${isDiscussion ? ' nav-label-discussion' : ''}">${label}</span>`;
      item.onclick = () => { currentDayId = d.id; render(); };
      items.appendChild(item);
    });
    grp.appendChild(items);
    nav.appendChild(grp);
  });
}

// ─── GLOBAL STATS ────────────────────────────────────────────────────────────
function updateStats() {
  const doneDays = state.doneDays.length;
  const totalImpl = days.reduce((a, d) => a + d.implement.length, 0);
  const doneImpl = state.doneImpl.length;
  const pct = Math.round((doneDays / days.length) * 100);
  document.getElementById('sp-pct').textContent = pct + '%';
  document.getElementById('sp-bar').style.width = pct + '%';
  document.getElementById('sp-days').textContent = doneDays;
  document.getElementById('sp-tasks').textContent = doneImpl;
}

  const map = { 1: ['--blue','--blue-dim'], 2: ['--green','--green-dim'], 3: ['--amber','--amber-dim'], 4: ['--red','--red-dim'], 5: ['--purple','--purple-dim'], 6: ['--teal','--teal-dim'] };
  return map[stageId] || ['--blue','--blue-dim'];
}

      <div class="section-body open" id="sb-impl-${day.id}">
        <ul class="impl-list">
          ${day.implement.map((t, i) => {
            const key = day.id + '-impl-' + i;
            const done = state.doneImpl.includes(key);
            return `
              <li class="impl-item${done ? ' impl-done' : ''}" id="impl-${key}" onclick="toggleImpl('${key}')">
                <div class="impl-item-row">
                  <div class="impl-checkbox">${done ? '<span style="color:#fff;font-size:10px;font-weight:700">✓</span>' : ''}</div>
                  <div>
                    <div class="impl-title">${t.title}</div>
                    <div class="impl-desc">${t.desc}</div>
                  </div>
                </div>
                ${t.code ? `<div class="impl-item-code">${escHtml(t.code)}</div>` : ''}
              </li>
            `;
          }).join('')}
        </ul>
      </div>
    </div>
  `;

  // Resources section — omitted entirely when a session has no external links
  if (day.resources.length) {
  html += `
    <div class="section-card" id="sc-res-${day.id}">
      <div class="section-card-header open" onclick="toggleSection('res-${day.id}')">
        <div class="section-icon" style="background:var(${dim})">🔗</div>
        <div class="section-title">Resources</div>
        <span class="section-count">${day.resources.length} links</span>
        <span class="chevron open" id="chev-res-${day.id}">▼</span>
      </div>
      <div class="section-body open" id="sb-res-${day.id}">
        <div class="resource-grid">
          ${day.resources.map(r => `
            <a class="resource-card" href="${r.url}" target="_blank" rel="noopener">
              <div class="resource-type-icon" style="background:var(${dim})">${r.type}</div>
              <div>
                <div class="resource-name">${r.name}</div>
                <div class="resource-desc">${r.desc}</div>
                <span class="resource-tag" style="background:var(${dim});color:var(${col})">${r.tag}</span>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  }

  // Nav controls
  const idx = days.findIndex(d => d.id === currentDayId);
  const prevDay = days[idx - 1];
  const nextDay = days[idx + 1];
  const navLabel = (d) => d.stage === 6 ? 'Discussion' : ('Topic ' + d.day);
  html += `
    <div class="nav-controls">
      <button class="nav-btn" onclick="goDay('${prevDay?.id}')" ${!prevDay ? 'disabled' : ''}>← ${prevDay ? navLabel(prevDay) + ': ' + prevDay.title.split(' ').slice(0,3).join(' ') + '…' : 'Start'}</button>
      <button class="nav-btn primary" onclick="goDay('${nextDay?.id}')" ${!nextDay ? 'disabled' : ''}>${nextDay ? navLabel(nextDay) + ': ' + nextDay.title.split(' ').slice(0,3).join(' ') + '…' : 'Complete!'} →</button>
    </div>
  `;

  document.getElementById('main-body').innerHTML = html;
  document.querySelector('.main').scrollTo(0, 0);
}

// ─── INTERACTIONS ────────────────────────────────────────────────────────────
window.toggleSection = function(id) {
  const body = document.getElementById('sb-' + id);
  const hdr = body?.previousElementSibling;
  const chev = document.getElementById('chev-' + id);
  if (!body) return;
  const open = body.classList.toggle('open');
  hdr?.classList.toggle('open', open);
  if (chev) chev.classList.toggle('open', open);
};

window.toggleDayDone = function(dayId) {
  if (state.doneDays.includes(dayId)) {
    state.doneDays = state.doneDays.filter(d => d !== dayId);
  } else {
    state.doneDays.push(dayId);
  }
  save();
  render();
};

window.toggleImpl = function(key) {
  if (state.doneImpl.includes(key)) {
    state.doneImpl = state.doneImpl.filter(k => k !== key);
  } else {
    state.doneImpl.push(key);
  }
  save();
  // Update only the impl item
  const item = document.getElementById('impl-' + key);
  if (item) {
    const done = state.doneImpl.includes(key);
    item.classList.toggle('impl-done', done);
    item.querySelector('.impl-title').classList.toggle('', done);
    item.querySelector('.impl-checkbox').innerHTML = done ? '<span style="color:#fff;font-size:10px;font-weight:700">✓</span>' : '';
    // Re-color title
    item.querySelector('.impl-title').style.color = done ? 'var(--green)' : '';
  }
  updateStats();
};

window.goDay = function(dayId) {
  if (!dayId || dayId === 'undefined') return;
  currentDayId = dayId;
  render();
};

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  buildSidebar();
  renderMain();
  updateStats();
  // Progress ticks here are per-browser, so they stay open to everyone —
  // this only surfaces who you are and links to the admin login.
  Auth.renderFooter(document.getElementById('auth-slot'), { guestNote: 'Progress saves in this browser' });
}

render();
</script>
</body>
</html>
